<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Lo ajusta ThemeProvider al fondo real del tema elegido en la app. -->
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Almacenamiento en la nube." />
    <title>Drive</title>
    <link rel="icon" type="image/png" href="/api/v1/settings/logo/favicon" />
    <link rel="apple-touch-icon" href="/api/v1/settings/logo/favicon" />
    <!-- Tipografías: Poppins (cuerpo) + Google Sans se resuelve localmente si está disponible. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
      // Aplica el tema antes de pintar para evitar flash (FOUC).
      (function () {
        try {
          var stored = localStorage.getItem('pc-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || ((stored === 'system' || !stored) && prefersDark);
          if (dark) document.documentElement.classList.add('dark');
          if (!dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f9fafc');
          // Estilo de color (Blizzard por defecto; Nebula, Supernova, Techmaleon):
          // lo cachea usePlatformSettings para que no parpadee al recargar.
          // Nombre de la organización (última configuración conocida): el título
          // correcto desde el primer instante. En producción ya llega puesto por
          // api/spa.php.
          var cached = JSON.parse(localStorage.getItem('pc-platform-settings') || 'null');
          if (cached && cached.organization_name) document.title = cached.organization_name + ' - Drive';
          var preset = localStorage.getItem('pc-theme-preset');
          if (preset === 'nebula' || preset === 'supernova' || preset === 'techmaleon') {
            document.documentElement.setAttribute('data-theme-preset', preset);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
